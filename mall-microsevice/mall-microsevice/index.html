<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商系统 - 前端界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            transition: box-shadow 0.3s;
        }

        .product-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .product-card h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .product-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .hidden {
            display: none;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <div class="logo">🛒 电商系统（网关模式）</div>
        <div class="user-info">
            <span id="userStatus">未登录</span>
            <button class="btn" onclick="showLogin()" id="loginBtn">登录</button>
            <button class="btn btn-secondary hidden" onclick="logout()" id="logoutBtn">退出</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="section">
                <h3 class="section-title">用户登录</h3>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="输入密码">
                </div>
                <button class="btn" onclick="login()">登录</button>
            </div>

            <div class="section">
                <h3 class="section-title">购物车操作</h3>
                <div class="form-group">
                    <label>商品ID</label>
                    <input type="number" id="cartProductId" placeholder="输入商品ID">
                </div>
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="cartProductName" placeholder="输入商品名称">
                </div>
                <div class="form-group">
                    <label>价格</label>
                    <input type="number" id="cartPrice" placeholder="输入价格" step="0.01">
                </div>
                <div class="form-group">
                    <label>数量</label>
                    <input type="number" id="cartQuantity" placeholder="输入数量" value="1">
                </div>
                <button class="btn btn-success" onclick="addToCart()">添加到购物车</button>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="content">
            <!-- 标签页 -->
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('products')">商品列表</button>
                <button class="tab-btn" onclick="switchTab('cart')">我的购物车</button>
                <button class="tab-btn" onclick="switchTab('apiTest')">API测试</button>
            </div>

            <!-- 消息提示 -->
            <div id="message" class="message"></div>

            <!-- 商品列表 -->
            <div id="productsTab" class="tab-content active">
                <h3 class="section-title">商品列表（通过网关访问）</h3>
                <button class="btn" onclick="loadProducts()">加载商品</button>
                <div id="productList" class="product-grid">
                    <!-- 商品会动态加载到这里 -->
                </div>
            </div>

            <!-- 购物车 -->
            <div id="cartTab" class="tab-content">
                <h3 class="section-title">我的购物车</h3>
                <button class="btn" onclick="loadCart()">刷新购物车</button>
                <div id="cartList" style="margin-top: 20px;">
                    <!-- 购物车商品会动态加载到这里 -->
                </div>
            </div>

            <!-- API测试 -->
            <div id="apiTestTab" class="tab-content">
                <h3 class="section-title">API接口测试（网关测试）</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
                    <div class="section">
                        <h4>网关状态</h4>
                        <button class="btn" onclick="testGatewayStatus()">测试网关状态</button>
                        <pre id="gatewayResult" style="margin-top: 10px; background: #f8f9fa; padding: 10px; border-radius: 5px; font-size: 12px;"></pre>
                    </div>

                    <div class="section">
                        <h4>商品服务测试</h4>
                        <button class="btn" onclick="testProductService()">测试商品服务</button>
                        <pre id="productResult" style="margin-top: 10px; background: #f8f9fa; padding: 10px; border-radius: 5px; font-size: 12px;"></pre>
                    </div>

                    <div class="section">
                        <h4>用户服务测试</h4>
                        <button class="btn" onclick="testUserService()">测试用户服务</button>
                        <pre id="userResult" style="margin-top: 10px; background: #f8f9fa; padding: 10px; border-radius: 5px; font-size: 12px;"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== 配置区域 ====================
    // 所有请求都通过网关（端口9000）
    const GATEWAY_URL = 'http://localhost:9000';
    const API_BASE = `${GATEWAY_URL}/api/user`;     // 用户服务通过网关
    const PRODUCT_API = `${GATEWAY_URL}/api/product`; // 商品服务通过网关
    // =================================================

    // 当前登录用户
    let currentUser = null;
    let currentUserId = null;

    // 显示消息
    function showMessage(type, text) {
        const messageEl = document.getElementById('message');
        messageEl.className = `message ${type}`;
        messageEl.textContent = text;
        messageEl.style.display = 'block';

        setTimeout(() => {
            messageEl.style.display = 'none';
        }, 3000);
    }

    // 切换标签页
    function switchTab(tabName) {
        // 更新按钮状态
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        // 更新内容显示
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.getElementById(tabName + 'Tab').classList.add('active');
    }

    // 显示登录界面
    function showLogin() {
        document.getElementById('username').focus();
    }

    // 用户登录
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showMessage('error', '请输入用户名和密码');
            return;
        }

        try {
            showMessage('info', '登录中...');

            const response = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            // 检查响应状态
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();

            if (data.code === 200) {
                currentUser = data.data;
                currentUserId = data.data.id;

                // 更新UI
                document.getElementById('userStatus').textContent = `欢迎，${data.data.nickname || data.data.username}`;
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');

                showMessage('success', '登录成功！');

                // 清空输入框
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';

                // 加载购物车
                loadCart();
            } else {
                showMessage('error', data.msg || '登录失败');
            }
        } catch (error) {
            showMessage('error', `登录失败: ${error.message}`);
        }
    }

    // 用户退出
    function logout() {
        currentUser = null;
        currentUserId = null;

        // 更新UI
        document.getElementById('userStatus').textContent = '未登录';
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');

        showMessage('success', '已退出登录');

        // 清空购物车显示
        document.getElementById('cartList').innerHTML = '';
    }

    // 加载商品列表
    async function loadProducts() {
        try {
            showMessage('info', '通过网关加载商品中...');

            const response = await fetch(`${PRODUCT_API}/list`);

            // 检查响应状态
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();

            const productListEl = document.getElementById('productList');

            if (data.code === 200 && data.data && data.data.length > 0) {
                productListEl.innerHTML = data.data.map(product => `
                        <div class="product-card">
                            <h4>${product.name}</h4>
                            <p>${product.description || '暂无描述'}</p>
                            <p class="price">¥${product.price}</p>
                            <p>库存: ${product.stock}件</p>
                            <button class="btn" onclick="viewProductDetail(${product.id})">查看详情</button>
                            <button class="btn btn-success" onclick="quickAddToCart(${product.id}, '${product.name}', ${product.price})">加入购物车</button>
                        </div>
                    `).join('');

                showMessage('success', `通过网关加载了 ${data.data.length} 个商品`);
            } else {
                productListEl.innerHTML = '<p>暂无商品数据</p>';
                showMessage('info', '暂无商品数据');
            }
        } catch (error) {
            showMessage('error', `加载商品失败: ${error.message}`);
            document.getElementById('productList').innerHTML = '<p>加载失败，请检查商品服务是否启动</p>';
        }
    }

    // 查看商品详情
    async function viewProductDetail(productId) {
        try {
            const response = await fetch(`${PRODUCT_API}/${productId}`);
            const data = await response.json();

            if (data.code === 200) {
                alert(`商品详情:\n名称: ${data.data.name}\n描述: ${data.data.description}\n价格: ¥${data.data.price}\n库存: ${data.data.stock}件`);
            } else {
                alert('获取商品详情失败');
            }
        } catch (error) {
            alert(`获取详情失败: ${error.message}`);
        }
    }

    // 快速添加到购物车
    function quickAddToCart(productId, productName, price) {
        if (!currentUserId) {
            showMessage('error', '请先登录');
            showLogin();
            return;
        }

        document.getElementById('cartProductId').value = productId;
        document.getElementById('cartProductName').value = productName;
        document.getElementById('cartPrice').value = price;
        document.getElementById('cartQuantity').value = 1;

        addToCart();
    }

    // 添加到购物车
    async function addToCart() {
        if (!currentUserId) {
            showMessage('error', '请先登录');
            return;
        }

        const productId = document.getElementById('cartProductId').value;
        const productName = document.getElementById('cartProductName').value;
        const price = document.getElementById('cartPrice').value;
        const quantity = document.getElementById('cartQuantity').value;

        if (!productId || !productName || !price) {
            showMessage('error', '请填写完整的商品信息');
            return;
        }

        try {
            showMessage('info', '添加中...');

            const cartData = {
                userId: currentUserId,
                productId: parseInt(productId),
                productName: productName,
                price: parseFloat(price),
                num: parseInt(quantity) || 1
            };

            const response = await fetch(`${GATEWAY_URL}/api/cart/add`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(cartData)
            });

            const data = await response.json();

            if (data.code === 200 || data.data === true) {
                showMessage('success', '商品已添加到购物车');

                // 清空表单
                document.getElementById('cartProductId').value = '';
                document.getElementById('cartProductName').value = '';
                document.getElementById('cartPrice').value = '';
                document.getElementById('cartQuantity').value = 1;

                // 刷新购物车
                loadCart();
            } else {
                showMessage('error', data.msg || '添加失败');
            }
        } catch (error) {
            showMessage('error', `添加失败: ${error.message}`);
        }
    }

    // 加载购物车
    async function loadCart() {
        const cartListEl = document.getElementById('cartList');

        if (!currentUserId) {
            cartListEl.innerHTML = '<p>请先登录查看购物车</p>';
            return;
        }

        try {
            const response = await fetch(`${GATEWAY_URL}/api/cart/list?userId=${currentUserId}`);
            const data = await response.json();

            if (data.code === 200 && data.data && data.data.length > 0) {
                cartListEl.innerHTML = `
                        <div style="margin-bottom: 20px;">
                            <p>共 ${data.data.length} 件商品</p>
                        </div>
                        ${data.data.map(item => `
                            <div class="cart-item">
                                <div>
                                    <strong>${item.productName}</strong>
                                    <p>价格: ¥${item.price} × ${item.num}</p>
                                    <p>小计: ¥${(item.price * item.num).toFixed(2)}</p>
                                </div>
                                <div>
                                    <button class="btn btn-danger" onclick="deleteCartItem(${item.id})">删除</button>
                                </div>
                            </div>
                        `).join('')}
                    `;
            } else {
                cartListEl.innerHTML = '<p>购物车是空的</p>';
            }
        } catch (error) {
            cartListEl.innerHTML = '<p>加载购物车失败</p>';
        }
    }

    // 删除购物车商品
    async function deleteCartItem(cartId) {
        if (!confirm('确定要删除这个商品吗？')) return;

        try {
            const response = await fetch(`${GATEWAY_URL}/api/cart/${cartId}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (data.code === 200 || data.data === true) {
                showMessage('success', '删除成功');
                loadCart();
            } else {
                showMessage('error', '删除失败');
            }
        } catch (error) {
            showMessage('error', `删除失败: ${error.message}`);
        }
    }

    // API测试函数
    async function testGatewayStatus() {
        try {
            const response = await fetch(`${GATEWAY_URL}`);
            const text = await response.text();
            document.getElementById('gatewayResult').textContent = text;
        } catch (error) {
            document.getElementById('gatewayResult').textContent = `错误: ${error.message}`;
        }
    }

    async function testProductService() {
        try {
            const response = await fetch(`${PRODUCT_API}/list`);
            const data = await response.json();
            document.getElementById('productResult').textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('productResult').textContent = `错误: ${error.message}`;
        }
    }

    async function testUserService() {
        try {
            const response = await fetch(`${API_BASE}/health`);
            const text = await response.text();
            document.getElementById('userResult').textContent = text;
        } catch (error) {
            document.getElementById('userResult').textContent = `错误: ${error.message}`;
        }
    }

    // 页面加载时自动加载商品
    window.onload = function() {
        loadProducts();
    };
</script>
</body>
</html>
